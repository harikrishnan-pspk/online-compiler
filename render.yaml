services:
  - type: web
    name: codeforge-backend
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: DATABASE_URL
        value: sqlite:///./codeforge.db
      - key: ALLOWED_ORIGINS
        value: "https://online-compiler-peach.vercel.app,https://*.vercel.app"
