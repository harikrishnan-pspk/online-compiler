version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: codeforge-backend
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - PYTHONUNBUFFERED=1
    volumes:
      - ./backend/codeforge.db:/app/codeforge.db
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1024M

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: codeforge-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped
